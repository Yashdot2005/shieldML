version: "3.8"

services:
  shieldml-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shieldml-serving
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
